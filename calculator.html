<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>آلة حاسبة</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e1e2f, #2d2d44);
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
    .calculator {
      width: 320px;
      background: #222233;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .display {
      background: #1a1a2a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: left;
      direction: ltr;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      word-break: break-all;
    }
    .display .expression {
      color: #8888aa;
      font-size: 18px;
      min-height: 24px;
    }
    .display .result {
      color: #ffffff;
      font-size: 36px;
      font-weight: bold;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 22px;
      cursor: pointer;
      transition: 0.1s;
      color: #fff;
      background: #33334a;
    }
    button:active { transform: scale(0.95); }
    .op { background: #ff9500; }
    .op:active { background: #e08500; }
    .eq { background: #34c759; }
    .eq:active { background: #2aa846; }
    .func { background: #565675; }
    .clear { background: #ff3b30; }
    .clear:active { background: #d63028; }
    .span2 { grid-column: span 2; }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression">&nbsp;</div>
      <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
      <button class="clear span2" onclick="clearAll()">C</button>
      <button class="func" onclick="backspace()">⌫</button>
      <button class="func" onclick="appendOp('÷')">÷</button>

      <button onclick="appendNum('7')">7</button>
      <button onclick="appendNum('8')">8</button>
      <button onclick="appendNum('9')">9</button>
      <button class="op" onclick="appendOp('×')">×</button>

      <button onclick="appendNum('4')">4</button>
      <button onclick="appendNum('5')">5</button>
      <button onclick="appendNum('6')">6</button>
      <button class="op" onclick="appendOp('−')">−</button>

      <button onclick="appendNum('1')">1</button>
      <button onclick="appendNum('2')">2</button>
      <button onclick="appendNum('3')">3</button>
      <button class="op" onclick="appendOp('+')">+</button>

      <button class="span2" onclick="appendNum('0')">0</button>
      <button onclick="appendDot()">.</button>
      <button class="eq" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let current = '0';
    let expression = '';

    const resultEl = document.getElementById('result');
    const exprEl = document.getElementById('expression');

    function updateDisplay() {
      resultEl.textContent = current;
      exprEl.innerHTML = expression || '&nbsp;';
    }

    function appendNum(n) {
      if (current === '0' || current === 'خطأ') {
        current = n;
      } else {
        current += n;
      }
      updateDisplay();
    }

    function appendDot() {
      if (current === 'خطأ') { current = '0'; }
      if (!current.includes('.')) current += '.';
      updateDisplay();
    }

    function appendOp(op) {
      if (current === 'خطأ') { current = '0'; }
      if (expression === '' || /[+\-×÷]$/.test(expression)) {
        expression = current + ' ' + op;
      } else {
        expression += ' ' + current + ' ' + op;
      }
      current = '0';
      updateDisplay();
    }

    function calculate() {
      if (/[+\-×÷]$/.test(expression)) {
        expression += ' ' + current;
      } else if (expression === '') {
        return;
      } else {
        expression += ' ' + current;
      }
      try {
        const result = evalExpr(expression);
        exprEl.textContent = expression + ' =';
        current = String(result);
        expression = '';
      } catch (e) {
        current = 'خطأ';
        expression = '';
      }
      updateDisplay();
    }

    function evalExpr(str) {
      // تحويل الرموز ثم التقييم بأمان
      const tokens = str.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
      // منع أي كود ضار
      if (/[^0-9+\-*/(). ]/.test(tokens)) throw new Error('bad');
      return new Function('return (' + tokens + ')')();
    }

    function clearAll() {
      current = '0';
      expression = '';
      updateDisplay();
    }

    function backspace() {
      if (current === 'خطأ') { current = '0'; }
      else if (current.length > 1) { current = current.slice(0, -1); }
      else { current = '0'; }
      updateDisplay();
    }

    updateDisplay();
  </script>
</body>
</html>
